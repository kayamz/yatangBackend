server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    # JPA View Parameter
    org.hibernate.type.descriptor.sql: trace

spring:
  config:
    import:
      - classpath:application-data-source.yml
      - classpath:application-data-default.yml

# OpenAI (레시피 추천). 환경변수 OPENAI_API_KEY 설정 권장.
# JWT 만료(ms). 기본 315360000000 ≈ 10년 (3650일)
jwt:
  expiration-ms: ${JWT_EXPIRATION_MS:315360000000}

yatang:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  show-actuator: true

