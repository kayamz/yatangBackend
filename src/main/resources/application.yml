server:
  port: 8080
  forward-headers-strategy: framework
  # OAuth 로그인 시 브라우저(앱 WebView)가 세션(state) 쿠키를 유지해야 함.
  # HTTP(DuckDNS) 단계에서는 secure=false. HTTPS 적용 후 true 권장.
  servlet:
    session:
      cookie:
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true

logging:
  level:
    org.hibernate.type.descriptor.sql: ${HIBERNATE_BIND_LOG_LEVEL:warn}

spring:
  config:
    import:
      - classpath:application-data-source.yml
      - classpath:application-data-default.yml
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:changeme-google-client-id}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:changeme-google-secret}
            # 기본값은 Spring이 현재 요청의 baseUrl로 자동 구성합니다.
            # 필요 시(프록시 환경 등) GOOGLE_OAUTH2_REDIRECT_URI 로 고정하세요.
            redirect-uri: ${GOOGLE_OAUTH2_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - profile
              - email
          # 카카오: https://developers.kakao.com/docs/ko/kakaologin/rest-api — redirect_uri는 콘솔 등록값과 완전 일치 (KOE006 방지)
          kakao:
            client-id: ${KAKAO_REST_API_KEY:changeme-kakao-rest-key}
            client-secret: ${KAKAO_CLIENT_SECRET:changeme-kakao-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # 카카오 콘솔과 동일한 문자열. 운영은 KAKAO_OAUTH2_REDIRECT_URI 로 실제 도메인 지정.
#            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            redirect-uri: ${KAKAO_OAUTH2_REDIRECT_URI:http://localhost:3000/login/oauth2/code/kakao}
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# OpenAI (레시피 추천). 환경변수 OPENAI_API_KEY 설정 권장.
# JWT_SECRET은 운영에서 32자 이상의 랜덤 문자열로 반드시 설정하세요.
# 로컬에서 비워두면 서버 시작마다 임시 랜덤 secret을 생성하므로 재시작 시 기존 토큰은 만료됩니다.
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

yatang:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8100,capacitor://localhost,ionic://localhost}
    swagger-enabled: ${SWAGGER_ENABLED:false}
  oauth2:
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT:http://localhost:3000/oauth/callback}
    # 앱(Custom Tab) OAuth 완료 후 딥링크. Android/iOS URL 스킴과 동일해야 함.
    app-redirect-url: ${OAUTH_APP_REDIRECT:com.kaya.yatang://oauth/callback}
  ingredient-images:
    storage-dir: ${INGREDIENT_IMAGE_DIR:uploads/user-ingredient-images}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1
    # 동시 AI 추천 호출 상한(인스턴스당). EC2 1대 기준 보호용 — 수평 확장 시 인스턴스마다 별도 한도.
    max-concurrent-recipe-suggests: ${OPENAI_MAX_CONCURRENT_RECIPE_SUGGESTS:3}
    recipe-suggest-acquire-timeout-ms: ${OPENAI_RECIPE_SUGGEST_ACQUIRE_TIMEOUT_MS:90000}
  ai-suggest:
    daily-limit-guest: ${AI_SUGGEST_DAILY_LIMIT_GUEST:5}
    daily-limit-user: ${AI_SUGGEST_DAILY_LIMIT_USER:20}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  show-actuator: true

