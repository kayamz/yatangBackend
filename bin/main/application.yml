server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    # JPA View Parameter
    org.hibernate.type.descriptor.sql: trace

spring:
  config:
    import:
      - classpath:application-data-source.yml
      - classpath:application-data-default.yml
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:changeme-google-client-id}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:changeme-google-secret}
            scope:
              - openid
              - profile
              - email
          # 카카오: https://developers.kakao.com/docs/ko/kakaologin/rest-api — redirect_uri는 콘솔 등록값과 완전 일치 (KOE006 방지)
          kakao:
            client-id: ${KAKAO_REST_API_KEY:changeme-kakao-rest-key}
            client-secret: ${KAKAO_CLIENT_SECRET:changeme-kakao-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # 카카오 콘솔과 동일한 문자열. 운영은 KAKAO_OAUTH2_REDIRECT_URI 로 실제 도메인 지정.
            redirect-uri: ${KAKAO_OAUTH2_REDIRECT_URI:http://localhost:3000/login/oauth2/code/kakao}
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# OpenAI (레시피 추천). 환경변수 OPENAI_API_KEY 설정 권장.
# JWT 만료(ms). 기본 315360000000 ≈ 10년 (3650일)
jwt:
  expiration-ms: ${JWT_EXPIRATION_MS:315360000000}

yatang:
  oauth2:
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT:http://localhost:3000/oauth/callback}
  ingredient-images:
    storage-dir: ${INGREDIENT_IMAGE_DIR:uploads/user-ingredient-images}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  show-actuator: true

