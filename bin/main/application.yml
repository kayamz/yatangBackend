server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    # JPA View Parameter
    org.hibernate.type.descriptor.sql: trace

spring:
  config:
    import:
      - classpath:application-data-source.yml
      - classpath:application-data-default.yml

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  show-actuator: true

